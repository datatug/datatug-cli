name: Release artifacts

# Each merge to main computes a version, publishes the GitHub release artifacts
# and then, once the release is public, updates the Homebrew tap by calling
# publish-packages.yml (job publish-homebrew-cask below). The owner reversed the
# manual-only decision of 2026-09-23 on 2026-11-06 ("Yes, automate it"): the
# tap had sat at v0.103.2 for 39 releases. GoReleaser itself still skips its
# homebrew publisher, so publish-packages.yml stays the one path that writes
# the tap, for automatic and manual (re)publishing alike. It runs after
# publication, so a tap failure turns the run red but never holds a release.
#
# datatug-cli is pre-1.0: allow_major_version_bump stays false, so a stray
# `feat!:` is capped to a minor bump instead of jumping to v1.0.0.
#
# DuckDB requires native cgo builds. The shared release workflow dispatches
# native-release.yml at its guarded exact tag, then imports verified binaries
# before the existing archive/sign/notarize/promotion gates.

on:
  push:
    branches:
      - main

# One release at a time; a second merge queues instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dependency-release:
    name: Classify dependency release
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      bump: ${{ steps.classify.outputs.bump }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Classify the pushed commit title
        id: classify
        run: |
          bump="$(python3 scripts/release-dependency-bump.py < "$GITHUB_EVENT_PATH")"
          printf 'bump=%s\n' "$bump" >> "$GITHUB_OUTPUT"

  release:
    needs: dependency-release
    # Pin the released private-dependency and macOS signing contract.
    uses: strongo/cicd/.github/workflows/release.yml@751025d2bac74e10f666325a39e76d849adcfa0c # exact-tag native retry and publication gates
    permissions:
      contents: write
      # Read exact-head CI results and dispatch the exact-tag native build.
      # A reusable workflow cannot grant more permission than its caller.
      actions: write
    with:
      # Only dependency-titled pushes supply a patch fallback. The shared
      # workflow still chooses larger conventional bumps and enforces all gates.
      default_bump: ${{ needs.dependency-release.outputs.bump }}
      GOPRIVATE: github.com/datatug/datatug-core
      goprivate_github_app_client_id: Iv23li26w131Kv6u3IdM
      goprivate_github_app_owner: datatug
      goprivate_github_app_repositories: datatug-core
      # GoReleaser never writes the tap or Winget; publish-homebrew-cask below
      # updates the tap through publish-packages.yml after publication.
      goreleaser_extra_args: '--skip=homebrew,winget'
      # Refuse to tag or publish when Go CI did not pass for this exact
      # commit. Before this input a red suite could not stop a release —
      # and did not: v0.13.2
      # shipped six binaries from a commit whose `go build ./...` was red,
      # built against go-github v90 while go.mod declared v91, because
      # GoReleaser's `go mod tidy` before-hook re-added v90 in the runner.
      # Names the workflow's `name:`, not its filename; a name matching no
      # workflow fails rather than quietly disabling the gate.
      require_workflow_success: |
        Go CI
        Native release builds
      native_build_workflow: native-release.yml
      # Must be >= go.mod's `go` directive, whose current value is `go 1.27.3`
      # (it was 1.27.0 when adopting github.com/strongo/buildinfo raised it;
      # the directive has moved on since). The shared release job runs its
      # `go mod tidy` before-hook under this setup-go version with
      # GOTOOLCHAIN=local, so leaving it unset (default '1.27.0') fails with
      # "go.mod requires go >= 1.27.3" before the build starts. This input is
      # also kept equal to golangci.yml's strongo_workflow go_version, so CI
      # proves the same toolchain the release builds under.
      go_version: '1.27.3'
      # Pre-1.0: cap an accidental major (feat!:) to a minor bump.
      allow_major_version_bump: false
      # Block publication unless the macOS build is genuinely signed, notarized,
      # AND executable. Without this the preflight gate never runs: specscore-cli
      # v0.37.10 shipped a binary macOS SIGKILLs, with a green release.
      # See https://github.com/strongo/cicd/issues/66
      require_notarized_macos: true
    secrets:
      GOPRIVATE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      # The verified release uses only its repository token. The public hub
      # mirror below mints its own narrowly scoped, short-lived App token.
      # Only publish-packages.yml (called below) holds the Homebrew tap token.
      # macOS signing + notarization. These activate the `notarize:` block in
      # .goreleaser.yaml, which is gated on MACOS_SIGN_P12 being set. See
      # ingitdb/ingitdb-cli's release.yml, the reference implementation this
      # block is copied from.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      NOTARIZE_ISSUER_ID: ${{ secrets.NOTARIZE_ISSUER_ID }}
      NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
      NOTARIZE_KEY: ${{ secrets.NOTARIZE_KEY }}

  # Publishes the verified, notarized release and all binary assets to the public
  # hub repository (datatug/datatug), preserving the stable download location
  # used by users and installers now that datatug/datatug-cli is also public.
  publish-datatug-release:
    name: Publish release to datatug/datatug
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out publisher script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # datatug-cli is public; the private-repository-only publisher secret is unavailable.
      # Mint only contents-write access to the public hub, revoked after the job.
      - name: Mint exact public release token
        id: public-release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23li26w131Kv6u3IdM
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
          owner: datatug
          repositories: datatug
          permission-contents: write

      - name: Publish release to datatug/datatug
        env:
          GH_SOURCE_TOKEN: ${{ github.token }}
          GH_TARGET_TOKEN: ${{ steps.public-release-token.outputs.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          if [[ -z "${GH_TARGET_TOKEN:-}" ]]; then
            echo "::error::The scoped public-release App token was not minted."
            exit 1
          fi
          bash scripts/publish-datatug-release.sh "$TAG" "datatug/datatug-cli" "datatug/datatug"

  # Updates the Homebrew tap to the release just published, through the same
  # workflow a person can start by hand. `tag` is empty when no release went
  # public (a docs or chore merge cut no tag). The release is already public
  # in datatug/datatug here, so the called workflow skips re-publishing it
  # (publish_hub_release: false). Its last step reads the tap back and fails
  # this job unless the cask carries the release's version and checksums.
  publish-homebrew-cask:
    name: Publish Homebrew cask
    needs: [release, publish-datatug-release]
    if: ${{ !cancelled() && needs.release.outputs.tag != '' && needs.publish-datatug-release.result == 'success' }}
    uses: ./.github/workflows/publish-packages.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.release.outputs.tag }}
      publish_hub_release: false
    secrets: inherit
