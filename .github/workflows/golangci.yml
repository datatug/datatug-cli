name: Go CI

on:
  push:
    # Only run on pushes to the default branch (e.g. merges). PRs are covered
    # by the pull_request trigger below; scoping push to main avoids running
    # the same checks twice (push + pull_request) on every PR-branch push.
    branches:
      - main
    paths:
      - 'go.*'
      - '**/*.go'
      - 'src/**'
      - '.github/workflows/golangci.yml'
  #    tags:
  #      - 'v[0-9]+\.[0-9]+\.[0-9]+' # Push events to matching v*, i.e. v20.15.10
  pull_request:
    branches:
      - '**'
    paths:
      - 'go.*'
      - '**/*.go'
      - 'src/**'
      - '.github/workflows/*.yml'

jobs:

  strongo_workflow:
    permissions:
      contents: write
    # Pinned to an exact tag, not the moving @v1, which is being retired.
    # workflow.yml is currently byte-identical at both refs, so this is a
    # no-op in behaviour — but @v1 silently served a 14-versions-stale
    # release.yml, which is how a macOS signing gate came to no-op. Pin
    # exactly so a moving tag can never change this job underneath us.
    uses: strongo/cicd/.github/workflows/workflow.yml@v1.14.17
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      # Uses the C-based github.com/mattn/go-sqlite3 driver, which requires cgo.
      cgo_enabled: true
      # Version bump + release now happen in release.yml (continuous delivery on
      # push to main). This workflow only builds/lints/tests — disable its bump
      # so it does not create a competing tag.
      disable-version-bumping: true
      code_coverage: true
      # Lowered from 60.9 (2026-08-28): the 2026-08-25/26 Go 1.27 toolchain
      # bump (f98ec681, 96ec4e5) changed how `go tool cover` counts covered
      # statements and dropped measured total coverage to 55.8% with no
      # tests removed — confirmed by "Go CI" passing at 60.9%+ through
      # 6069b41 (pre-bump) and failing on every commit since. Set to 55.5 to
      # reflect the current, actually-measured state with a small buffer
      # rather than chasing the toolchain's new counting on unrelated PRs.
      min_test_coverage_percent: 55.5
  # Fail fast on go.mod/go.sum drift — the gap that shipped v0.13.2.
  #
  # Renovate raised two PRs for the same go-github v90->v91 bump a minute
  # apart. #187 merged first and ADDED the v91 require beside v90; CI passed,
  # because v90 was still there and every import still resolved. #188 was cut
  # from the pre-#187 base, so it REPLACED the v90 line, leaving go.mod with a
  # duplicated v91 require, no v90, and five source files still importing v90.
  #
  # `strongo_workflow` above builds and tests, so it correctly went red on #188
  # and on the merge commit. Nothing enforced that: `main` has no branch
  # protection, so #188 merged red, and Release runs as an independent workflow
  # that never consults Go CI. This job makes the *earlier* signal — an
  # untidy go.mod — red on the PR that introduces it, which would have failed
  # #187 on its unused v91 require, before the pair could interleave.
  #
  # `-diff` only reports; it never rewrites go.mod, so it cannot mask drift the
  # way a mutating `go mod tidy` does.
  go-mod-tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Must be >= go.mod's `go` directive, same constraint as release.yml.
          go-version: '1.27.0'
          cache: true
      - name: go mod tidy -diff
        run: go mod tidy -diff
