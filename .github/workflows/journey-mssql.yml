name: Journey (SQL Server)

# NOT a required check, and deliberately separate from golangci.yml ("Go CI"): that workflow's checks are
# required by branch protection and gate releases, so it runs on every change and cannot take `paths:` filters.
# This one can, and it does: it only runs when the SQL-script export, its verifier or its journey changes.
#
# It loads the scripts of `datatug db copy --to sqlscript:...?dialect=mssql` into a real SQL Server 2022 (sqlcmd
# inside the server's container, with the flags the script's header recommends) for the edge-case fixture, the
# hostile-value fixture, a fixture of random foreign key graphs and the pinned demo databases, and runs the
# cross-engine verifier (internal/crossverify) over every one. See scripts/check-journey-mssql.sh.
on:
  pull_request:
    paths:
      - 'pkg/dbcopy/**'
      - 'internal/crossverify/**'
      - 'apps/datatugapp/commands/cmd_db_copy*.go'
      - 'scripts/check-journey-mssql.sh'
      - 'apps/datatugapp/commands/cmd_scan_db.go'
      - 'apps/datatugapp/commands/cmd_query*.go'
      - 'apps/datatugapp/commands/server_journey_*_real_test.go'
      - 'pkg/api/**'
      - 'pkg/secureread/**'
      - 'scripts/lib/source-journey.sh'
      - 'scripts/journey-datasets.txt'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/journey-mssql.yml'
  push:
    branches:
      - main
    paths:
      - 'pkg/dbcopy/**'
      - 'internal/crossverify/**'
      - 'apps/datatugapp/commands/cmd_db_copy*.go'
      - 'scripts/check-journey-mssql.sh'
      - 'apps/datatugapp/commands/cmd_scan_db.go'
      - 'apps/datatugapp/commands/cmd_query*.go'
      - 'apps/datatugapp/commands/server_journey_*_real_test.go'
      - 'pkg/api/**'
      - 'pkg/secureread/**'
      - 'scripts/lib/source-journey.sh'
      - 'scripts/journey-datasets.txt'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/journey-mssql.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  journey-mssql:
    name: Journey (SQL Server 2022)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The server image, pinned by digest (SQL Server 2022, mcr.microsoft.com/mssql/server:2022-latest on 2026-10-16).
      # A bot that updates the digest must also re-run this journey: that is what the job is for.
      #
      # LICENCE: this image is Microsoft SQL Server Developer edition, and running it needs ACCEPT_EULA=Y
      # (scripts/check-journey-mssql.sh passes it). That accepts the image's end-user licence agreement. The founder
      # decided on 2026-10-16 (decision D10) that CI may accept it for AUTOMATED TESTING ONLY: the Developer edition
      # is licensed for development and testing, never production. The image is pulled and thrown away with the
      # runner; it is never redistributed, republished or copied into a release.
      MSSQL_IMAGE: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7
        with:
          # Must be >= go.mod's `go` directive, same constraint as release.yml.
          go-version: '1.27.3'
          cache: true
      - name: SQL Server journey
        env:
          CGO_ENABLED: '1'
        run: ./scripts/check-journey-mssql.sh
