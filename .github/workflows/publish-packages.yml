name: Publish latest packages

# Updates the Homebrew tap to a published release. release.yml calls it after
# every release (job publish-homebrew-cask); a person can also start it to
# republish a tag or the latest release.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: true
        type: string
      publish_hub_release:
        description: 'Also (re)publish the release to datatug/datatug first'
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (leave empty for latest release)'
        required: false
        type: string
        default: ''

concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  homebrew:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Called from release.yml this job runs inside the `release` concurrency
    # group: a hung gh call must not hold every later release for six hours.
    timeout-minutes: 15
    steps:
      - name: Check out publisher
        uses: actions/checkout@v7

      - name: Find published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then
            tag="$(gh release view --repo datatug/datatug --json tagName --jq .tagName 2>/dev/null || true)"
            if [[ -z "$tag" ]]; then
              tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            fi
          fi
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # datatug-cli is public, so the private-repository-only DATATUG_RELEASE_TOKEN
      # never reaches this job, and HOMEBREW_TAP_GITHUB_TOKEN may write only to
      # the tap (it got HTTP 403 on datatug/datatug release assets on
      # 2026-11-06). Mint the same narrowly scoped, short-lived App token the
      # publish-datatug-release job in release.yml uses.
      - name: Mint exact public release token
        if: ${{ github.event_name == 'workflow_dispatch' || inputs.publish_hub_release }}
        id: public-release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23li26w131Kv6u3IdM
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
          owner: datatug
          repositories: datatug
          permission-contents: write

      # Called from release.yml the release is already public there; re-uploading
      # would briefly remove assets users are downloading.
      - name: Ensure release is published to datatug/datatug
        if: ${{ github.event_name == 'workflow_dispatch' || inputs.publish_hub_release }}
        env:
          GH_SOURCE_TOKEN: ${{ github.token }}
          GH_TARGET_TOKEN: ${{ steps.public-release-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          bash scripts/publish-datatug-release.sh "$TAG" "$GITHUB_REPOSITORY" "datatug/datatug"

      - name: Download and verify release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir release
          if ! gh release download "$TAG" --repo datatug/datatug --dir release 2>/dev/null; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
          fi
          cd release
          sha256sum -c "datatug_${TAG#v}_checksums.txt"

      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: datatug/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap

      - name: Publish cask for latest release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          bash scripts/publish-homebrew-cask.sh "$TAG" "release/datatug_${TAG#v}_checksums.txt" tap/Casks/datatug.rb
          cd tap
          if git diff --quiet -- Casks/datatug.rb; then
            echo "Homebrew cask is already current."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Casks/datatug.rb
          git commit -m "chore: publish datatug $TAG"
          git push origin HEAD

      # Reads the cask back from the public tap and fails this run unless it is
      # at the release's version with the checksums of the published archives.
      # A failure here stops nothing else: nothing depends on this workflow.
      - name: Verify the tap serves the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_REPO: datatug/datatug
        run: bash scripts/verify-homebrew-cask.sh "$TAG"
