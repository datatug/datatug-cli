name: Journey (Account-free HTTP)

# NOT a required check, and deliberately separate from golangci.yml ("Go CI"): that workflow's checks are
# required by branch protection and gate releases, so it runs on every change and cannot take `paths:` filters.
# This one can, and it does: it only runs when an account-free HTTP source, its command wiring, the journey
# scripts or the shared fixture lifecycle helper change.
#
# It runs the two account-free journeys end to end against real, disposable servers. Each script owns its
# fixture: scripts/check-journey-couchdb.sh starts one pinned CouchDB container on a random loopback port,
# scripts/check-journey-postgrest.sh starts one pinned PostgreSQL + PostgREST Compose project on random
# loopback ports. Both drive the Go command journey and then the datatug binary built from this checkout,
# so a proof is a separate CLI process, not only a cobra call in the test binary.
#
# The shared lifecycle helper (scripts/lib/fixture-lifecycle.sh) is not trusted on the strength of the
# PostgREST journey alone: scripts/test-fixture-lifecycle.sh regression-tests the shipped teardown and trap
# code in a subshell. That regression and the script lint run in both jobs, before any container starts.
#
# No hosted account, secret or service is involved beyond the private Core read token the CLI already needs
# to build. Docker (with the Compose plugin) and python3 are preinstalled on the GitHub-hosted Ubuntu runner.

on:
  pull_request:
    paths:
      - 'pkg/dbcopy/**'
      - 'pkg/api/**'
      - 'pkg/secureread/**'
      - 'pkg/schemers/**'
      - 'apps/datatugapp/commands/**'
      - 'scripts/check-journey-couchdb.sh'
      - 'scripts/check-journey-postgrest.sh'
      - 'scripts/test-fixture-lifecycle.sh'
      - 'scripts/lib/fixture-lifecycle.sh'
      - 'testdata/postgrest/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/journey-accountfree-http.yml'
  push:
    branches:
      - main
    paths:
      - 'pkg/dbcopy/**'
      - 'pkg/api/**'
      - 'pkg/secureread/**'
      - 'pkg/schemers/**'
      - 'apps/datatugapp/commands/**'
      - 'scripts/check-journey-couchdb.sh'
      - 'scripts/check-journey-postgrest.sh'
      - 'scripts/test-fixture-lifecycle.sh'
      - 'scripts/lib/fixture-lifecycle.sh'
      - 'testdata/postgrest/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/journey-accountfree-http.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  couchdb:
    name: Journey (CouchDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Must be >= go.mod's `go` directive, same constraint as release.yml.
          go-version: '1.27.3'
          cache: true
      - name: Fixture lifecycle regression
        run: bash scripts/test-fixture-lifecycle.sh
      - name: Script syntax and shellcheck
        run: |
          set -euo pipefail
          scripts=(
            scripts/check-journey-couchdb.sh
            scripts/check-journey-postgrest.sh
            scripts/test-fixture-lifecycle.sh
            scripts/lib/fixture-lifecycle.sh
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          # The runner image ships shellcheck. A missing linter is a hard failure
          # here, never a silent pass: the scripts must lint on the image CI uses.
          command -v shellcheck >/dev/null || { echo "shellcheck is not installed on this runner" >&2; exit 1; }
          shellcheck --version
          shellcheck -x "${scripts[@]}"
      - name: CouchDB journey
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/couchdb-journey.log"
          # pipefail keeps the journey script's own status through tee, so a
          # failing journey fails this step; tee only captures the receipt.
          bash scripts/check-journey-couchdb.sh 2>&1 | tee "$log"
          grep -qF -- 'couchdb journey passed:' "$log"
      - name: Owned CouchDB container removed
        run: |
          set -euo pipefail
          # The journey script removes its exact owned container in its EXIT trap.
          # This proves the receipt above describes a cleanup that really happened,
          # and nothing from this job's unique name prefix survived the run.
          if docker ps -aq --filter 'name=datatug-cli-couchdb-' | grep -q .; then
            docker ps -a --filter 'name=datatug-cli-couchdb-'
            echo "the owned CouchDB container was not removed" >&2
            exit 1
          fi
          echo "no datatug-cli-couchdb- container remains"

  postgrest:
    name: Journey (PostgREST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Must be >= go.mod's `go` directive, same constraint as release.yml.
          go-version: '1.27.3'
          cache: true
      - name: Fixture lifecycle regression
        run: bash scripts/test-fixture-lifecycle.sh
      - name: Script syntax and shellcheck
        run: |
          set -euo pipefail
          scripts=(
            scripts/check-journey-couchdb.sh
            scripts/check-journey-postgrest.sh
            scripts/test-fixture-lifecycle.sh
            scripts/lib/fixture-lifecycle.sh
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          command -v shellcheck >/dev/null || { echo "shellcheck is not installed on this runner" >&2; exit 1; }
          shellcheck --version
          shellcheck -x "${scripts[@]}"
      - name: PostgREST journey
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/postgrest-journey.log"
          # pipefail keeps the journey script's own status through tee, so a
          # failing journey fails this step; tee only captures the receipts.
          bash scripts/check-journey-postgrest.sh 2>&1 | tee "$log"
          # The full receipt is printed only after the explicit teardown of the
          # owned Compose project and its volume, so both lines must be present.
          grep -qF -- 'postgrest journey PASS:' "$log"
          grep -qF -- 'owned project and volume removed' "$log"
