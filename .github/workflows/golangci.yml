name: Go CI

# ⚠ THE NAMES IN THIS FILE ARE LOAD-BEARING.
#
# Branch protection on main requires these three checks by exact string:
#
#   strongo_workflow / Build & test
#   strongo_workflow / Lint
#   go.mod is tidy
#
# A check's context is "<job id> / <job name>" for a reusable-workflow job, and
# the job's `name:` for a normal one. So renaming the `strongo_workflow` job
# key below, or the `go-mod-tidy` job's `name:`, or a job inside strongo/cicd's
# shared workflow.yml, retires a required context WITHOUT retiring the
# requirement. GitHub then waits forever for a check that will never post
# again, and every pull request becomes permanently unmergeable — the failure
# is silent, and it looks like CI hanging rather than a config error.
#
# If you rename any of them, update the protection in the same change:
#   gh api repos/datatug/datatug-cli/branches/main/protection \
#     --jq '.required_status_checks.contexts'
#
# The `paths:` filters were removed for the same reason; see the note on the
# triggers below.

# NO `paths:` filters, deliberately. This workflow's checks are REQUIRED by
# branch protection on main, and GitHub leaves a required check that never
# runs pending forever rather than passing it — so a paths-filtered required
# check makes any pull request outside the filter permanently unmergeable
# (a README-only change could never land).
#
# The filters also weakened the release gate. release.yml sets
# `require_workflow_success: 'Go CI'`, which asks whether this workflow
# succeeded for the exact commit. A commit the filters excluded produces no
# run, so the guard has nothing to check and, correctly but unhelpfully,
# waits out its grace and continues ungated. Running always means the gate
# always has a real verdict and never burns that wait.
#
# The cost is one ~1 minute run on pushes and pull requests that touch no Go
# code. That is the price of the checks being trustworthy.
on:
  push:
    # Still scoped to the default branch: pull-request branches are covered by
    # the pull_request trigger below, so this avoids running twice per push.
    branches:
      - main
  #    tags:
  #      - 'v[0-9]+\.[0-9]+\.[0-9]+' # Push events to matching v*, i.e. v20.15.10
  pull_request:
    branches:
      - '**'

env:
  GOPRIVATE: github.com/datatug/datatug-core

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  strongo_workflow:
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@e9d8156d4d20c4faef7b7b5f01ba3c3c10ba5abc # v1.24.0
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GOPRIVATE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
    with:
      GOPRIVATE: github.com/datatug/datatug-core
      goprivate_github_app_client_id: Iv23li26w131Kv6u3IdM
      goprivate_github_app_owner: datatug
      goprivate_github_app_repositories: datatug-core
      require_conventional_pr_title: true
      # Uses the C-based github.com/mattn/go-sqlite3 driver, which requires cgo.
      cgo_enabled: true
      # The release-artifacts workflow owns version tags and GitHub assets.
      # This workflow only builds/lints/tests and never creates a tag.
      disable-version-bumping: true
      code_coverage: true
      # Enforce 100% statement test coverage across datatug-cli.
      min_test_coverage_percent: 100
  # Fail fast on go.mod/go.sum drift — the gap that shipped v0.13.2.
  #
  # Renovate raised two PRs for the same go-github v90->v91 bump a minute
  # apart. #187 merged first and ADDED the v91 require beside v90; CI passed,
  # because v90 was still there and every import still resolved. #188 was cut
  # from the pre-#187 base, so it REPLACED the v90 line, leaving go.mod with a
  # duplicated v91 require, no v90, and five source files still importing v90.
  #
  # `strongo_workflow` above builds and tests, so it correctly went red on #188
  # and on the merge commit. Nothing enforced that: `main` has no branch
  # protection, so #188 merged red, and Release runs as an independent workflow
  # that never consults Go CI. This job makes the *earlier* signal — an
  # untidy go.mod — red on the PR that introduces it, which would have failed
  # #187 on its unused v91 require, before the pair could interleave.
  #
  # `-diff` only reports; it never rewrites go.mod, so it cannot mask drift the
  # way a mutating `go mod tidy` does.
  go-mod-tidy:
    name: go.mod is tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@v7
        with:
          # Must be >= go.mod's `go` directive, same constraint as release.yml.
          go-version: '1.27.3'
          cache: true
      - name: go mod tidy -diff
        run: go mod tidy -diff

  # Guards the fix in internal/hermetictest and scripts/check-hermetic-tests.sh
  # against regressing: `go test ./...` must never read or write the real
  # user's home, XDG config, or XDG cache directories — see both files' own
  # doc comments for why (a leaking test polluted the founder's real
  # ~/.datatug/chat with ~395 files of litter before this job existed).
  # A separate job, not a step folded into strongo_workflow above, so this
  # module's own hermeticity gate is never hidden behind — or accidentally
  # broken by an update to — the shared strongo/cicd workflow.
  hermetic-tests:
    name: Hermetic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@v7
        with:
          # Must be >= go.mod's `go` directive, same constraint as release.yml.
          go-version: '1.27.3'
          cache: true
      - name: check-hermetic-tests.sh
        env:
          # Matches strongo_workflow's cgo_enabled: true above — several
          # tests (github.com/mattn/go-sqlite3) require cgo.
          CGO_ENABLED: '1'
        run: ./scripts/check-hermetic-tests.sh

  # A release is built with CGO_ENABLED=0 (.goreleaser.yaml), where the cgo SQLite
  # driver (github.com/mattn/go-sqlite3, registered as "sqlite3") is a stub that
  # fails on first use. A scan that opened that driver could read no SQLite file in
  # any released binary, while every test of strongo_workflow passed, as it runs with
  # cgo on. This job runs the scan's SQLite tests, and the journey of a first user (a
  # SQLite file scanned into a folder, then read the way chat, saved queries, serve and
  # the web app read it), in a build with cgo off, and the test that runs the quick start
  # of the README (TestQuickStartOfTheREADMEIsTrue). Those tests make their database
  # files with the pure-Go driver and import no cgo one, so cgo off is all they need.
  scan-without-cgo:
    name: Scan without cgo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@v7
        with:
          # Must be >= go.mod's `go` directive, same constraint as release.yml.
          go-version: '1.27.3'
          cache: true
      - name: Scan a SQLite file with cgo off
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 -run 'TestScanDbCatalog_SQLite3|TestScanJourney|TestQuickStartOfTheREADMEIsTrue|TestQueryDuckDBRequiresCGO' ./pkg/api/ ./apps/datatugapp/commands/
      - name: Export SQLite to native inGitDB with cgo off
        env:
          CGO_ENABLED: '0'
        run: |
          go test -count=1 -run TestExportInGitDB_RecordsFormatsRoundTrip ./pkg/dbcopy/
          go build -o "$RUNNER_TEMP/datatug-export-smoke" .
          export_parent=$(mktemp -d "$RUNNER_TEMP/datatug-export.XXXXXX")
          "$RUNNER_TEMP/datatug-export-smoke" db export \
            --from "sqlite://$PWD/pkg/dbcopy/testdata/chinook.db" \
            --to "ingitdb://$export_parent/native" --records-format csv
          test -f "$export_parent/native/Artist/records.csv"
          test -f "$export_parent/native/Artist/.collection/definition.yaml"

  # The PostgreSQL scan (`datatug scan -D postgres --dsn-env NAME`), query
  # (`datatug query run`) and copy (`datatug db copy`) against a real server. Every
  # other test of the scan reads through a fake schema reader and the test binary refuses to
  # dial (apps/datatugapp/commands/scan_never_dials_test.go), so this is the one place the scan
  # meets PostgreSQL: the real command, the real opener and the real DALgo reader, with a role and
  # a database that the test makes on the service. The URL below is the service's own, for this
  # job only: an administrator's, to the maintenance database, on a container that lives as long
  # as the job. The tests skip when it is not set, which `go test` reports as success, so
  # scripts/check-journey-postgres.sh fails the job on any SKIP and on a missing PASS line for
  # each test by name. Not a required check for merging a pull request (that is a repository
  # setting). It IS a gate on the release: this job is part of the workflow named "Go CI", and
  # release.yml requires "Go CI" green for the exact commit before it tags or publishes anything,
  # so a red run of this job on main holds the release until it is re-run or fixed. A red job is
  # a finding about the scan, except when the service container itself is the cause (the image
  # pull, the health check): re-run it then.
  #
  # The job runs on every major version of the matrix below, and each run is a job of the workflow
  # that the release waits for: a release needs both green. 18 is in it because a fix of the adapter
  # is about a constraint that only PostgreSQL 18 has (a not-null constraint that is not validated);
  # 17 stays because the first journey was written on it. The tests read the version from the
  # server and check it against DATATUG_TEST_POSTGRES_MAJOR, so a matrix that stopped changing the
  # image would fail and not test one version twice. The image tag is written from the matrix, so a
  # bot that updates the tag of a service finds none here: a version is added to the matrix, or
  # dropped from it, on purpose.
  journey-postgres:
    name: Journey (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: ci-only-service-password
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATATUG_TEST_POSTGRES_URL: postgres://postgres:ci-only-service-password@127.0.0.1:54329/postgres?sslmode=disable
      DATATUG_TEST_POSTGRES_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@v7
        with:
          # Must be >= go.mod's `go` directive, same constraint as release.yml.
          go-version: '1.27.3'
          cache: true
      - name: Scan and query a real PostgreSQL server
        env:
          # The test binary of the commands package links the cgo SQLite driver, as in
          # strongo_workflow above.
          CGO_ENABLED: '1'
        run: ./scripts/check-journey-postgres.sh

  # Runs in the always-present Go CI workflow so exact-commit release gating
  # observes browser/asset regressions as well as Go tests. No path filter/skip.
  mcp-apps-browser:
    name: MCP Apps browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DATATUG_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pkg/mcpserver/app/package-lock.json
      - name: Check out exact public demo fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: datatug/datatug-demo-project
          ref: 08cc4d367e33cca82269bff54dc8a35b242e9937
          path: .browser-fixtures/demo
          persist-credentials: false
      - name: Verify locked App source and embedded asset
        working-directory: pkg/mcpserver/app
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build:check
          npx --no-install playwright install --with-deps chromium
      - name: Build actual CLI using the release pure-Go configuration
        env:
          CGO_ENABLED: '0'
        run: go build -o "$RUNNER_TEMP/datatug-mcp-apps" .
      - name: Exercise official sandbox and actual CLI saved SQL
        run: |
          DATATUG_MCP_TEST_BINARY="$RUNNER_TEMP/datatug-mcp-apps" \
          DATATUG_DEMO_PROJECT_DIR="$GITHUB_WORKSPACE/.browser-fixtures/demo/demo-project-1" \
          DATATUG_MCP_APPS_ARTIFACTS="$RUNNER_TEMP/mcp-apps-browser-artifacts" \
          npm --prefix pkg/mcpserver/app run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mcp-apps-browser
          path: ${{ runner.temp }}/mcp-apps-browser-artifacts
          if-no-files-found: error

  watch-firestore:
    name: Watch Firestore conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Run pinned emulator with owned teardown
        env:
          WATCH_FIRESTORE_ARTIFACTS: ${{ runner.temp }}/watch-firestore
        run: ./scripts/check-watch-firestore.sh
      - name: Upload transaction evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: watch-firestore
          path: ${{ runner.temp }}/watch-firestore
          if-no-files-found: error
