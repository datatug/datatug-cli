name: Go CI

# The ONE CI workflow of this repository (backstage rule
# one-ci-workflow-smart-jobs): every check of a pull request or a push to main
# is a job here. Branch protection on main requires exactly one check, `ci-ok`
# (the last job), so jobs can be added, merged, split or renamed without
# touching the protection. release.yml requires this workflow, by its name
# "Go CI", to be green for the exact commit before it tags or publishes; keep
# the name, and keep the filename (a renamed file leaves the old workflow
# listed under the same name, which the release gate could resolve instead).
#
# No workflow-level `paths:` filters. The first job, `changes`, runs
# scripts/ci-scope.sh and every scoped job reads its outputs. A skipped job
# counts as passed in `ci-ok`; a failed or cancelled one fails it.
#
# Jobs are split only where the split buys something: a different runner
# (native matrix), a service stack (journeys), a long independent suite on the
# critical path (hermetic tests), or an independent rerun of a flaky real
# server. Everything else is a step of an existing job; see the rule for why
# (each job repeats checkout, private-module auth, setup-go, module download
# and a compile, and is billed rounded up to the minute).
on:
  push:
    # Pull-request branches are covered by the pull_request trigger below.
    branches:
      - main
  pull_request:
    branches:
      - '**'

env:
  GOPRIVATE: github.com/datatug/datatug-core

# A new push cancels an outdated pull-request run. A push to main never cancels
# or replaces another main run: each commit gets its own group, so its release
# gate always finds a finished run for that exact commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  changes:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.scope.outputs.code }}
      mysql: ${{ steps.scope.outputs.mysql }}
      mssql: ${{ steps.scope.outputs.mssql }}
      oracle: ${{ steps.scope.outputs.oracle }}
      clickhouse: ${{ steps.scope.outputs.clickhouse }}
      couchdb: ${{ steps.scope.outputs.couchdb }}
      libsql: ${{ steps.scope.outputs.libsql }}
      postgrest: ${{ steps.scope.outputs.postgrest }}
      mongodb: ${{ steps.scope.outputs.mongodb }}
      redis: ${{ steps.scope.outputs.redis }}
      typesense: ${{ steps.scope.outputs.typesense }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as its merge commit, whose first
          # parent is the base tip, so depth 2 has the base.
          fetch-depth: 2
          persist-credentials: false
      - name: Scope script regression and shellcheck
        run: |
          set -euo pipefail
          bash scripts/test-ci-scope.sh
          command -v shellcheck >/dev/null || { echo "shellcheck is not installed on this runner" >&2; exit 1; }
          shellcheck -x scripts/ci-scope.sh scripts/test-ci-scope.sh
      - name: Determine scopes
        id: scope
        run: |
          set -euo pipefail
          # A pull request runs what its diff selects. A push to main runs
          # every scope: it is the commit the release gates on, and a narrow
          # push (docs only) on top of an earlier commit whose run failed or
          # is still running must not release that commit's code unchecked.
          case "$GITHUB_EVENT_NAME" in
            pull_request) base=HEAD^1 ;;
            *) base= ;;
          esac
          bash scripts/ci-scope.sh "$base" | tee -a "$GITHUB_OUTPUT"

  # ⚠ The check names "strongo_workflow / Build & test" and
  # "strongo_workflow / Lint" are no longer required by branch protection
  # (ci-ok is), but strongo/cicd's shared workflow still names them. This job
  # always runs: it is the build, the lint and the 100% coverage gate.
  strongo_workflow:
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@b9bc69e5e3c3123956fc82a41d393cdd0cb23cbf # v1.25.5
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GOPRIVATE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
    with:
      GOPRIVATE: github.com/datatug/datatug-core
      goprivate_github_app_client_id: Iv23li26w131Kv6u3IdM
      goprivate_github_app_owner: datatug
      goprivate_github_app_repositories: datatug-core
      require_conventional_pr_title: true
      # Uses the C-based github.com/mattn/go-sqlite3 driver, which requires cgo.
      cgo_enabled: true
      # The release-artifacts workflow owns version tags and GitHub assets.
      # This workflow only builds/lints/tests and never creates a tag.
      disable-version-bumping: true
      code_coverage: true
      # Enforce 100% statement test coverage across datatug-cli.
      min_test_coverage_percent: 100
      # Must be >= go.mod's `go` directive, same constraint as release.yml.
      # This input drives setup-go for BOTH the Lint and Build & test jobs of
      # the shared workflow, and its default ('1.27.0') is below this module's
      # `go` directive. Keep in sync with release.yml's go_version: a mismatch
      # means CI proves a build under a different toolchain than the release
      # actually uses.
      go_version: '1.27.3'

  # The pure-Go (CGO_ENABLED=0) configuration a release is built with
  # (.goreleaser.yaml), checked in one job because every step needs the same
  # toolchain and the same pure-Go binary, built once:
  #
  # - go.mod is tidy. `-diff` only reports; it never rewrites go.mod, so it
  #   cannot mask drift the way a mutating `go mod tidy` does (the gap that
  #   shipped v0.13.2: a duplicated go-github require merged green).
  # - Scan without cgo. In a cgo-off build the cgo SQLite driver
  #   (github.com/mattn/go-sqlite3, "sqlite3") is a stub that fails on first
  #   use, while every test of strongo_workflow runs with cgo on. These tests
  #   make their files with the pure-Go driver, so cgo off is all they need.
  # - MCP Apps browser: the embedded App and the actual CLI's saved SQL in the
  #   official sandbox.
  pure-go:
    name: Pure-Go release build checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          # Must be >= go.mod's `go` directive, same constraint as release.yml.
          go-version: '1.27.4'
          cache: true
      - name: go mod tidy -diff
        run: go mod tidy -diff
      - name: Scan a SQLite file with cgo off
        run: go test -count=1 -run 'TestScanDbCatalog_SQLite3|TestScanJourney|TestQuickStartOfTheREADMEIsTrue|TestQueryDuckDBRequiresCGO' ./pkg/api/ ./apps/datatugapp/commands/
      - name: Build the pure-Go CLI once
        run: go build -o "$RUNNER_TEMP/datatug-purego" .
      - name: Export SQLite to native inGitDB with cgo off
        run: |
          go test -count=1 -run TestExportInGitDB_RecordsFormatsRoundTrip ./pkg/dbcopy/
          export_parent=$(mktemp -d "$RUNNER_TEMP/datatug-export.XXXXXX")
          "$RUNNER_TEMP/datatug-purego" db export \
            --from "sqlite://$PWD/pkg/dbcopy/testdata/chinook.db" \
            --to "ingitdb://$export_parent/native" --records-format csv
          test -f "$export_parent/native/Artist/records.csv"
          test -f "$export_parent/native/Artist/.collection/definition.yaml"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: pkg/mcpserver/app/package-lock.json
      - name: Check out exact public demo fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: datatug/datatug-demo-project
          ref: 08cc4d367e33cca82269bff54dc8a35b242e9937
          path: .browser-fixtures/demo
          persist-credentials: false
      - name: Verify locked App source and embedded asset
        working-directory: pkg/mcpserver/app
        env:
          DATATUG_TELEMETRY: '0'
          DO_NOT_TRACK: '1'
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build:check
          npx --no-install playwright install --with-deps chromium
      - name: Exercise official sandbox and actual CLI saved SQL
        env:
          DATATUG_TELEMETRY: '0'
          DO_NOT_TRACK: '1'
        run: |
          DATATUG_MCP_TEST_BINARY="$RUNNER_TEMP/datatug-purego" \
          DATATUG_DEMO_PROJECT_DIR="$GITHUB_WORKSPACE/.browser-fixtures/demo/demo-project-1" \
          DATATUG_MCP_APPS_ARTIFACTS="$RUNNER_TEMP/mcp-apps-browser-artifacts" \
          npm --prefix pkg/mcpserver/app run test:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mcp-apps-browser
          path: ${{ runner.temp }}/mcp-apps-browser-artifacts
          if-no-files-found: error

  # Guards internal/hermetictest and scripts/check-hermetic-tests.sh: `go test
  # ./...` must never read or write the real user's home, XDG config, or XDG
  # cache directories (a leaking test once littered the founder's real
  # ~/.datatug/chat with ~395 files). Its own job, not a step of
  # strongo_workflow: it is the longest Go suite and runs in parallel with it,
  # and an update of the shared workflow can never hide or break it.
  hermetic-tests:
    name: Hermetic tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          # Must be >= go.mod's `go` directive, same constraint as release.yml.
          go-version: '1.27.4'
          cache: true
      - name: check-hermetic-tests.sh
        env:
          # Several tests (github.com/mattn/go-sqlite3) require cgo.
          CGO_ENABLED: '1'
        run: ./scripts/check-hermetic-tests.sh

  # The native release targets, in the same file the release dispatches at its
  # exact tag (native-release.yml), so the PR check and the release build can
  # never drift apart. Called here instead of running on its own triggers, so
  # the release gate reads one workflow ("Go CI").
  native:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/native-release.yml
    secrets: inherit

  # The PostgreSQL scan (`datatug scan -D postgres --dsn-env NAME`), query
  # (`datatug query run`) and copy (`datatug db copy`) against a real server:
  # the real command, the real opener and the real DALgo reader. Every other
  # test of the scan reads through a fake schema reader and the test binary
  # refuses to dial (apps/datatugapp/commands/scan_never_dials_test.go). The
  # URL below is the service's own, for this job only. The tests skip when it
  # is not set, which `go test` reports as success, so
  # scripts/check-journey-postgres.sh fails the job on any SKIP and on a
  # missing PASS line for each test by name. A red job is a finding about the
  # scan, except when the service container itself is the cause (the image
  # pull, the health check): re-run it then.
  #
  # One job per major version: each needs its own service image. 18 is in it
  # because a fix of the adapter is about a constraint only PostgreSQL 18 has
  # (a not-null constraint that is not validated); 17 stays because the first
  # journey was written on it. The tests read the version from the server and
  # check it against DATATUG_TEST_POSTGRES_MAJOR.
  journey-postgres:
    name: Journey (PostgreSQL ${{ matrix.postgres }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: ci-only-service-password
        ports:
          - 54329:5432
        options: >-
          --memory 1g
          --cpus 1
          --pids-limit 128
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATATUG_TEST_POSTGRES_URL: postgres://postgres:ci-only-service-password@127.0.0.1:54329/postgres?sslmode=disable
      DATATUG_TEST_POSTGRES_MAJOR: ${{ matrix.postgres }}
      DATATUG_NATIVE_ASSURANCE_CI: '1'
      DATATUG_NATIVE_POOLER_CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          # Must be >= go.mod's `go` directive, same constraint as release.yml.
          go-version: '1.27.4'
          cache: true
      - name: Check native pooler ownership without services
        run: python3 -B scripts/native-postgres/test_fixture.py
      - name: Build the pinned bounded PgBouncer fixture
        run: bash scripts/native-postgres/build-fixture.sh
      - name: Scan and query a real PostgreSQL server
        env:
          # The test binary of the commands package links the cgo SQLite driver.
          CGO_ENABLED: '1'
        run: ./scripts/check-journey-postgres.sh
      - name: Remove only owned native pooler resources
        if: always()
        run: bash scripts/native-postgres/cleanup-fixture.sh

  # A real Firestore emulator (Java) with owned teardown. Its own job so a
  # flaky emulator start is re-run on its own.
  watch-firestore:
    name: Watch Firestore conformance
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
          cache: true
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Run pinned emulator with owned teardown
        env:
          WATCH_FIRESTORE_ARTIFACTS: ${{ runner.temp }}/watch-firestore
        run: ./scripts/check-watch-firestore.sh
      - name: Read the db copy YAML corpus back with PyYAML (YAML 1.1)
        # DATATUG_REQUIRE_PYYAML makes a missing PyYAML a failure instead of a
        # skip, so the read-back by a YAML 1.1 parser is binding here.
        env:
          DATATUG_REQUIRE_PYYAML: '1'
        run: |
          python3 -m pip install --user --break-system-packages 'PyYAML==6.0.2'
          go test ./pkg/dbmirror -run '^TestYAMLCorpusRoundTrips$' -count=1 -v | tee "$RUNNER_TEMP/pyyaml.txt"
          grep -q -- '--- PASS: TestYAMLCorpusRoundTrips' "$RUNNER_TEMP/pyyaml.txt"
      - name: Upload transaction evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: watch-firestore
          path: ${{ runner.temp }}/watch-firestore
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Source journeys against real disposable servers. Each loads the scripts of
  # `datatug db copy` or runs the CLI's scan/query against a pinned image and
  # proves its owned fixture was removed. They are grouped into a few jobs of
  # similar length; inside a job each journey is a step that runs only when its
  # scope is set, and the steps share one Go build cache. Oracle and SQL Server
  # keep a job each: they are the two longest and the two largest containers.
  #
  # LICENCES (founder decision D10, 2026-10-16): CI may run the SQL Server
  # Developer edition image (ACCEPT_EULA=Y, passed by the script) and Oracle
  # Database Free (Oracle Free Use Terms) for AUTOMATED TESTING ONLY. The images
  # are pulled and thrown away with the runner; never redistributed, republished
  # or copied into a release.
  #
  # Server images are pinned by digest. A bot that updates a digest must also
  # re-run the journey: that is what the job is for.
  # ---------------------------------------------------------------------------

  journey-oracle:
    name: Journey (Oracle Database Free)
    needs: changes
    if: needs.changes.outputs.oracle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # gvenzl/oracle-free:23-slim (Oracle AI Database 26ai Free 23.26.3) on 2026-10-16, by the digest of its
      # multi-architecture index. The Apache-2.0 label of the gvenzl image covers its build scripts only.
      ORACLE_IMAGE: gvenzl/oracle-free:23-slim@sha256:6d61d267a3b978c24c5ac1790e62e927416a0aec446bd86e4b3a1527562757bd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
          cache: true
      - name: Oracle journey
        env:
          CGO_ENABLED: '1'
        run: ./scripts/check-journey-oracle.sh

  journey-mssql:
    name: Journey (SQL Server 2022)
    needs: changes
    if: needs.changes.outputs.mssql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # mcr.microsoft.com/mssql/server:2022-latest on 2026-10-16 (Developer edition).
      MSSQL_IMAGE: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
          cache: true
      - name: SQL Server journey
        env:
          CGO_ENABLED: '1'
        run: ./scripts/check-journey-mssql.sh

  # MySQL 8.4 (SQL-script export loaded into a real server, the cross-engine
  # verifier, then scan/query/saved queries) and ClickHouse (bounded server,
  # command journey). Each journey keeps its own deadline and proves its owned
  # container is gone before the next one starts.
  journeys-sql:
    name: Journeys (MySQL, ClickHouse)
    needs: changes
    if: needs.changes.outputs.mysql == 'true' || needs.changes.outputs.clickhouse == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
          cache: true
      - name: MySQL readiness regression (no Docker)
        if: needs.changes.outputs.mysql == 'true'
        timeout-minutes: 5
        run: bash scripts/check-mysql-readiness.sh
      - name: MySQL journey
        if: needs.changes.outputs.mysql == 'true'
        timeout-minutes: 40
        env:
          CGO_ENABLED: '1'
          # mysql:8.4 on 2026-10-16.
          MYSQL_IMAGE: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        run: ./scripts/check-journey-mysql.sh
      - name: Owned MySQL container removed
        if: always() && needs.changes.outputs.mysql == 'true'
        timeout-minutes: 2
        run: bash scripts/check-no-owned-containers.sh datatug-journey-mysql-
      - name: ClickHouse journey
        if: ${{ !cancelled() && needs.changes.outputs.clickhouse == 'true' }}
        timeout-minutes: 15
        env:
          GOMAXPROCS: '2'
          GOFLAGS: '-p=2'
        run: bash scripts/check-journey-clickhouse.sh
      - name: Owned ClickHouse container removed
        if: always() && needs.changes.outputs.clickhouse == 'true'
        timeout-minutes: 2
        run: bash scripts/check-no-owned-containers.sh datatug-cli-clickhouse-

  # Sources whose script starts and owns a disposable server on a random
  # loopback port: PostgREST (Compose project), CouchDB, libSQL and Typesense.
  # Each journey keeps its own deadline and proves its owned container is gone
  # before the next one starts.
  journeys-http:
    name: Journeys (PostgREST, CouchDB, libSQL, Typesense)
    needs: changes
    if: needs.changes.outputs.postgrest == 'true' || needs.changes.outputs.couchdb == 'true' || needs.changes.outputs.libsql == 'true' || needs.changes.outputs.typesense == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: true
      # The published dalgo2libsql fixture is executed with Node: it needs fetch
      # and node:crypto, and the journey's receipt must come from the exact
      # fixture the pinned module ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.libsql == 'true'
        with:
          node-version: '26'
      - name: Fixture lifecycle regressions
        timeout-minutes: 5
        run: |
          set -euo pipefail
          bash scripts/test-fixture-lifecycle.sh
          bash scripts/test-typesense-lifecycle.sh
      - name: Script syntax and shellcheck
        timeout-minutes: 3
        run: |
          set -euo pipefail
          scripts=(
            scripts/check-no-owned-containers.sh
            scripts/check-journey-postgrest.sh
            scripts/check-journey-couchdb.sh
            scripts/test-fixture-lifecycle.sh
            scripts/lib/fixture-lifecycle.sh
            scripts/check-journey-libsql.sh
            scripts/lib/libsql-cli-journey.sh
            scripts/check-journey-typesense.sh
            scripts/test-typesense-lifecycle.sh
            scripts/lib/typesense-fixture-lifecycle.sh
            scripts/lib/typesense-cli-journey.sh
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          # The runner image ships shellcheck. A missing linter is a hard failure
          # here, never a silent pass: the scripts must lint on the image CI uses.
          command -v shellcheck >/dev/null || { echo "shellcheck is not installed on this runner" >&2; exit 1; }
          shellcheck --version
          shellcheck -x "${scripts[@]}"
      - name: PostgREST journey
        if: needs.changes.outputs.postgrest == 'true'
        timeout-minutes: 25
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/postgrest-journey.log"
          # pipefail keeps the journey script's own status through tee, so a
          # failing journey fails this step; tee only captures the receipts.
          bash scripts/check-journey-postgrest.sh 2>&1 | tee "$log"
          # The full receipt is printed only after the explicit teardown of the
          # owned Compose project and its volume, so both lines must be present.
          grep -qF -- 'postgrest journey PASS:' "$log"
          grep -qF -- 'owned project and volume removed' "$log"
      - name: CouchDB journey
        if: ${{ !cancelled() && needs.changes.outputs.couchdb == 'true' }}
        timeout-minutes: 25
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/couchdb-journey.log"
          bash scripts/check-journey-couchdb.sh 2>&1 | tee "$log"
          grep -qF -- 'couchdb journey passed:' "$log"
      - name: Owned CouchDB container removed
        if: always() && needs.changes.outputs.couchdb == 'true'
        timeout-minutes: 2
        run: bash scripts/check-no-owned-containers.sh datatug-cli-couchdb-
      - name: libSQL journey
        if: ${{ !cancelled() && needs.changes.outputs.libsql == 'true' }}
        timeout-minutes: 25
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/libsql-journey.log"
          # The script prints its pass line only after the published fixture
          # verified the teardown of its own container and recorded volumes.
          bash scripts/check-journey-libsql.sh 2>&1 | tee "$log"
          grep -qF -- 'libsql journey passed:' "$log"
          grep -qF -- 'teardown: containerRemoved=true' "$log"
          grep -qF -- 'libsql journey PASS:' "$log"
      - name: Owned libSQL container removed
        if: always() && needs.changes.outputs.libsql == 'true'
        timeout-minutes: 2
        run: bash scripts/check-no-owned-containers.sh dalgo-libsql-fixture-
      - name: Typesense journey
        if: ${{ !cancelled() && needs.changes.outputs.typesense == 'true' }}
        timeout-minutes: 25
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/typesense-journey.log"
          bash scripts/check-journey-typesense.sh 2>&1 | tee "$log"
          grep -qF -- 'Go command journey passed' "$log"
          grep -qF -- 'typesense CLI journey passed:' "$log"
          grep -qF -- 'typesense journey passed:' "$log"
      - name: Owned Typesense container removed
        if: always() && needs.changes.outputs.typesense == 'true'
        timeout-minutes: 2
        run: bash scripts/check-no-owned-containers.sh datatug-cli-typesense- label=datatug.fixture

  # MongoDB and Redis as job services. On ubuntu-22.04: the mongo service hit
  # SERVER-121912's kernel guard on ubuntu-latest, and 22.04 hosted runners keep
  # the supported 6.8 kernel series (https://jira.mongodb.org/browse/SERVER-125742).
  # Both services start for the job whichever is in scope; they are small.
  journeys-services:
    name: Journeys (MongoDB, Redis)
    needs: changes
    if: needs.changes.outputs.mongodb == 'true' || needs.changes.outputs.redis == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:9.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.12-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.4'
          cache: true
      - name: MongoDB journey
        if: needs.changes.outputs.mongodb == 'true'
        timeout-minutes: 15
        env:
          DATATUG_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/dalgo_cli_test
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/dalgo_mongo_test
        run: go test ./apps/datatugapp/commands ./pkg/dbcopy -run 'TestMongoDB' -count=1
      - name: Wired Cobra Redis journey and write refusal
        if: ${{ !cancelled() && needs.changes.outputs.redis == 'true' }}
        timeout-minutes: 15
        env:
          REDIS_TEST_URL: redis://localhost:6379/0
        run: go test -race ./apps/datatugapp/commands -run '^TestQueryRedis' -count=1 -v

  # The ONLY check branch protection requires. `if: always()` (not
  # `!cancelled()`): when the gate runs it must evaluate every result, and a
  # cancelled run must not report it as skipped, which GitHub treats as a
  # passed required check. A gate that never ran is absent, not passed.
  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - changes
      - strongo_workflow
      - pure-go
      - hermetic-tests
      - native
      - journey-postgres
      - watch-firestore
      - journey-oracle
      - journey-mssql
      - journeys-sql
      - journeys-http
      - journeys-services
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed or was out of scope
        env:
          NEEDS: ${{ toJSON(needs) }}
          # Jobs without a scope condition must have run and passed: one of
          # them reported as skipped means something upstream broke.
          ALWAYS: changes strongo_workflow pure-go hermetic-tests
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          # When every scope is selected (every push to main), no job may be
          # skipped: a scoped job that skips then has a broken condition, and
          # this catches it before the release.
          all=$(jq -r '.changes.outputs // {} | (length > 0 and all(.[]; . == "true"))' <<<"$NEEDS")
          bad=$(jq -r --arg always "$ALWAYS" --argjson all "$all" '($always | split(" ")) as $a
            | [to_entries[]
               | select(.value.result != "success")
               | select($all or (.key | IN($a[])) or .value.result != "skipped")
               | .key] | join(", ")' <<<"$NEEDS")
          if [ -n "$bad" ]; then
            echo "::error title=CI not green::$bad"
            exit 1
          fi
