version: 2

project_name: datatug

before:
  hooks:
    # VERIFY tidiness; never impose it. The mutating `go mod tidy` that used to
    # live here is exactly what let v0.13.2 ship a lie: PR #188 left go.mod
    # requiring go-github/v91 while every source file still imported v90, so
    # this hook silently re-added v90 in the ephemeral release runner and
    # GoReleaser happily built and published binaries against v90 — a fully
    # green Release on a commit whose `go build ./...` was red in Go CI.
    # `-diff` writes nothing and exits non-zero on drift, so a release now
    # stops instead of healing the tree out from under the tag.
    - go mod tidy -diff

builds:
  - id: datatug-unix
    main: .
    binary: datatug
    env: [ CGO_ENABLED=1 ]
    tool: python3
    command: scripts/native-release-go.py
    goos: [ linux, darwin ]
    goarch: [ amd64, arm64 ]
    ldflags:
      - -s -w
      - -X github.com/strongo/buildinfo.version={{.Version}}
      - -X github.com/strongo/buildinfo.commit={{.FullCommit}}
      - -X github.com/strongo/buildinfo.date={{.Date}}

  - id: datatug-windows
    main: .
    binary: datatug
    env: [ CGO_ENABLED=1 ]
    tool: python3
    command: scripts/native-release-go.py
    goos: [ windows ]
    goarch: [ amd64 ]
    ldflags:
      - -s -w
      - -X github.com/strongo/buildinfo.version={{.Version}}
      - -X github.com/strongo/buildinfo.commit={{.FullCommit}}
      - -X github.com/strongo/buildinfo.date={{.Date}}

archives:
  - id: tarball
    formats: [ tar.gz ]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    ids: [ datatug-unix ]
    files:
      - README.md
      - LICENSE
      - LICENSING.md
      - LICENSES/Apache-2.0.txt
      - LICENSES/COMMERCIAL-TERMS.md
      - THIRD_PARTY_NOTICES.md
      - pkg/mcpserver/app/build-manifest.json

  - id: zip
    formats: [ zip ]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    ids: [ datatug-windows ]
    files:
      - README.md
      - LICENSE
      - LICENSING.md
      - LICENSES/Apache-2.0.txt
      - LICENSES/COMMERCIAL-TERMS.md
      - THIRD_PARTY_NOTICES.md
      - pkg/mcpserver/app/build-manifest.json

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

# macOS signing + notarization — DORMANT unless MACOS_SIGN_P12 is set, in
# which case the shared strongo/cicd release.yml forwards it (and the other
# four Apple secrets) to this job. GoReleaser's notarize is pure Go (quill),
# so this runs on the existing job — no macOS runner needed. `datatug-unix`
# also builds linux artifacts; notarize only ever touches the darwin ones.
# See ingitdb/ingitdb-cli's .goreleaser.yaml, the reference implementation
# this block is copied from.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids: [datatug-unix]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        wait: true
        issuer_id: "{{ .Env.NOTARIZE_ISSUER_ID }}"
        key_id: "{{ .Env.NOTARIZE_KEY_ID }}"
        key: "{{ .Env.NOTARIZE_KEY }}"
        timeout: 20m

# GoReleaser publishes to THIS repository (datatug/datatug-cli), the only one
# the job's GITHUB_TOKEN can write to. The shared release workflow drafts the
# release here, then verifies, promotes and smoke-tests it from
# $GITHUB_REPOSITORY. The publish-datatug-release job in release.yml then
# copies the promoted release to the public hub repository datatug/datatug,
# which is where `datatug self-update` looks. Pointing this block at
# datatug/datatug fails with 403 "Resource not accessible by integration".
release:
  github:
    owner: datatug
    name: datatug-cli

# Homebrew cask (ecosystem standard; `brews:` is deprecated — see strongo/cicd
# README "Packaging conventions"). GoReleaser auto-installs the `datatug` binary
# from the archive, so the old `bin.install` and `--version` smoke test are no
# longer needed (casks have no install/test hook).
homebrew_casks:
  - name: datatug
    ids:
      - tarball
    description: "DataTug – Context-aware data viewer & collaborative query manager for effortless exploration of related data — CLI + Web UI"
    homepage: https://datatug.io
    # Cask has no license stanza; retained scoped texts do not grant an
    # aggregate license for the composite executable. See docs/native-packaging.md.

    repository:
      owner: datatug
      name: homebrew-tap
      # The automatic release skips Homebrew and has no cross-repo token.
      # Package publication is handled by publish-packages.yml instead.
      token: "{{ .Env.GORELEASER_GITHUB_TOKEN }}"
