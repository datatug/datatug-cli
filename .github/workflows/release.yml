name: Release artifacts

# Each merge to main still computes a version and publishes the GitHub release
# artifacts. Package-manager distribution is a separate manual workflow
# ("Publish latest packages", publish-packages.yml): by the owner's decision of
# 2026-09-23 a merge never updates the Homebrew tap. The tap is therefore behind
# until someone starts that workflow; the warn-homebrew-cask-behind job below
# says so after every release. It only warns and can never fail or delay one.
#
# datatug-cli is pre-1.0: allow_major_version_bump stays false, so a stray
# `feat!:` is capped to a minor bump instead of jumping to v1.0.0.
#
# The release binaries are CGO_ENABLED=0 (see .goreleaser.yaml builds), so they
# cross-compile cleanly on the shared ubuntu runner even though CI tests use cgo
# for the sqlite driver.

on:
  push:
    branches:
      - main

# One release at a time; a second merge queues instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Pin the released private-dependency and macOS signing contract.
    uses: strongo/cicd/.github/workflows/release.yml@v1.22.0 # 686765a7cb84ca84c3cef799f960c730663c182b
    permissions:
      contents: write
      # Lets the require_workflow_success guard below read Go CI's result for
      # this commit. A reusable workflow cannot grant itself more than its
      # caller allows, so this has to be here rather than in the shared
      # workflow. Without it the guard fails closed and says so.
      actions: read
    with:
      GOPRIVATE: github.com/datatug/datatug-core
      goprivate_github_app_client_id: Iv23li26w131Kv6u3IdM
      goprivate_github_app_owner: datatug
      goprivate_github_app_repositories: datatug-core
      # Keep GitHub release artifacts automatic, but never update downstream
      # package managers as a side effect of merging code.
      goreleaser_extra_args: '--skip=homebrew,winget'
      # Refuse to tag or publish when Go CI did not pass for this exact
      # commit. Before this input a red suite could not stop a release —
      # and did not: v0.13.2
      # shipped six binaries from a commit whose `go build ./...` was red,
      # built against go-github v90 while go.mod declared v91, because
      # GoReleaser's `go mod tidy` before-hook re-added v90 in the runner.
      # Names the workflow's `name:`, not its filename; a name matching no
      # workflow fails rather than quietly disabling the gate.
      require_workflow_success: 'Go CI, Everywhere candidate acceptance'
      # Must be >= go.mod's `go` directive. Adopting github.com/strongo/buildinfo
      # raised it to 1.27.0. The shared release job runs its `go mod tidy`
      # before-hook under this setup-go version with GOTOOLCHAIN=local, so
      # leaving it unset (default '1.26') fails with
      # "go.mod requires go >= 1.27.0" before the build starts.
      go_version: '1.27.3'
      # Pre-1.0: cap an accidental major (feat!:) to a minor bump.
      allow_major_version_bump: false
      # Block publication unless the macOS build is genuinely signed, notarized,
      # AND executable. Without this the preflight gate never runs: specscore-cli
      # v0.37.10 shipped a binary macOS SIGKILLs, with a green release.
      # See https://github.com/strongo/cicd/issues/66
      require_notarized_macos: true
    secrets:
      GOPRIVATE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      # This workflow has no cross-repository publishing token. Only the
      # manually triggered package workflow can update the Homebrew tap.
      # macOS signing + notarization. These activate the `notarize:` block in
      # .goreleaser.yaml, which is gated on MACOS_SIGN_P12 being set. See
      # ingitdb/ingitdb-cli's release.yml, the reference implementation this
      # block is copied from.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      NOTARIZE_ISSUER_ID: ${{ secrets.NOTARIZE_ISSUER_ID }}
      NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
      NOTARIZE_KEY: ${{ secrets.NOTARIZE_KEY }}

  # Publishes the verified, notarized release and all binary assets to the public
  # hub repository (datatug/datatug) so users and installers can download public
  # release artifacts while datatug/datatug-cli remains private.
  publish-datatug-release:
    name: Publish release to datatug/datatug
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out publisher script
        uses: actions/checkout@v7

      - name: Publish release to datatug/datatug
        env:
          GH_SOURCE_TOKEN: ${{ github.token }}
          GH_TARGET_TOKEN: ${{ secrets.DATATUG_RELEASE_TOKEN || secrets.GORELEASER_GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          if [[ -z "${GH_TARGET_TOKEN:-}" ]]; then
            echo "::error::No token found for publishing to datatug/datatug. Set DATATUG_RELEASE_TOKEN or GORELEASER_GITHUB_TOKEN with write access to datatug/datatug."
            exit 1
          fi
          bash scripts/publish-datatug-release.sh "$TAG" "datatug/datatug-cli" "datatug/datatug"

  # Says, as one ::warning:: annotation, when the Homebrew tap is behind the
  # release that was just published, and names the workflow that fixes it. It
  # never fails the run: the script exits 0 for every outcome (--warn-only), a
  # job that dies for another reason is made green by continue-on-error, and it
  # runs after the release, so it cannot hold a release back. `tag` is empty
  # when no release went public (a docs or chore merge cut no tag) and there is
  # nothing to compare then. It reads the public tap with the workflow's own
  # token and needs no secret. Two attempts, five seconds apart: the tap does
  # not move during a release, so a second read only covers a failed call.
  warn-homebrew-cask-behind:
    name: Warn when the Homebrew cask is behind
    needs: [release, publish-datatug-release]
    # !cancelled() keeps the job running when a smoke test after publication
    # failed: the release is public then and the tap question is still open.
    if: ${{ !cancelled() && needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    # The job sits inside the workflow-level `release` concurrency group and gh
    # has no request timeout: without a limit a stalled call would hold every
    # later release. The script's worst case is well under a minute.
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Check out the checker
        uses: actions/checkout@v7

      - name: Compare the tap's cask with the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          ATTEMPTS: '2'
          INTERVAL: '5'
        run: bash scripts/verify-homebrew-cask.sh --warn-only "$TAG"
