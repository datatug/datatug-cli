name: Release

# Continuous delivery: every merge to `main` runs the shared strongo/cicd
# release workflow, which bumps the version from conventional commits and
# releases it in one run (GoReleaser against this repo's .goreleaser.yaml).
# Pushing an explicit `vX.Y.Z` tag also works and releases that exact version.
# A docs/chore-only merge cuts no tag and publishes nothing.
#
# datatug-cli is pre-1.0: allow_major_version_bump stays false, so a stray
# `feat!:` is capped to a minor bump instead of jumping to v1.0.0. Cut v1.0.0
# deliberately by pushing that tag.
#
# The release binaries are CGO_ENABLED=0 (see .goreleaser.yaml builds), so they
# cross-compile cleanly on the shared ubuntu runner even though CI tests use cgo
# for the sqlite driver.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# One release at a time; a second push queues instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Pinned to an exact tag, not the moving @v1: that tag defines the
    # require_notarized_macos input but does NOT contain the
    # macos_signing_preflight job, so the gate silently no-ops there.
    uses: strongo/cicd/.github/workflows/release.yml@v1.14.14
    permissions:
      contents: write
    with:
      # Must be >= go.mod's `go` directive. Adopting github.com/strongo/buildinfo
      # raised it to 1.27.0. The shared release job runs its `go mod tidy`
      # before-hook under this setup-go version with GOTOOLCHAIN=local, so
      # leaving it unset (default '1.26') fails with
      # "go.mod requires go >= 1.27.0" before the build starts.
      go_version: '1.27.0'
      # Pre-1.0: cap an accidental major (feat!:) to a minor bump.
      allow_major_version_bump: false
      # Block publication unless the macOS build is genuinely signed, notarized,
      # AND executable. Without this the preflight gate never runs: specscore-cli
      # v0.37.10 shipped a binary macOS SIGKILLs, with a green release.
      # See https://github.com/strongo/cicd/issues/66
      require_notarized_macos: true
    secrets:
      # Cross-repo PAT for the Homebrew tap (datatug/homebrew-tap), forwarded to
      # GoReleaser as $GORELEASER_GITHUB_TOKEN and referenced by the cask's
      # repository.token. Reuses the repo's existing HOMEBREW_TAP_GITHUB_TOKEN.
      GORELEASER_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # macOS signing + notarization. These activate the `notarize:` block in
      # .goreleaser.yaml, which is gated on MACOS_SIGN_P12 being set. See
      # ingitdb/ingitdb-cli's release.yml, the reference implementation this
      # block is copied from.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      NOTARIZE_ISSUER_ID: ${{ secrets.NOTARIZE_ISSUER_ID }}
      NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
      NOTARIZE_KEY: ${{ secrets.NOTARIZE_KEY }}
