name: Journey (Account-free HTTP)

# NOT a required check, and deliberately separate from golangci.yml ("Go CI"): that workflow's checks are
# required by branch protection and gate releases, so it runs on every change and cannot take `paths:` filters.
# This one can, and it does: it only runs when an account-free HTTP source, its command wiring, the journey
# scripts or the shared fixture lifecycle helper change.
#
# CouchDB and libSQL run against disposable servers and exercise the CLI
# binary. PostgREST has its own always-reported workflow.

on:
  pull_request:
    paths:
      - 'pkg/dbcopy/**'
      - 'pkg/api/**'
      - 'pkg/secureread/**'
      - 'pkg/schemers/**'
      - 'apps/datatugapp/commands/**'
      - 'scripts/check-journey-couchdb.sh'
      - 'scripts/test-fixture-lifecycle.sh'
      - 'scripts/lib/fixture-lifecycle.sh'
      - 'scripts/check-journey-libsql.sh'
      - 'scripts/lib/libsql-cli-journey.sh'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/journey-accountfree-http.yml'
  push:
    branches:
      - main
    paths:
      - 'pkg/dbcopy/**'
      - 'pkg/api/**'
      - 'pkg/secureread/**'
      - 'pkg/schemers/**'
      - 'apps/datatugapp/commands/**'
      - 'scripts/check-journey-couchdb.sh'
      - 'scripts/test-fixture-lifecycle.sh'
      - 'scripts/lib/fixture-lifecycle.sh'
      - 'scripts/check-journey-libsql.sh'
      - 'scripts/lib/libsql-cli-journey.sh'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/journey-accountfree-http.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  couchdb:
    name: Journey (CouchDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Must be >= go.mod's `go` directive, same constraint as release.yml.
          go-version: '1.27.4'
          cache: true
      - name: Fixture lifecycle regression
        run: bash scripts/test-fixture-lifecycle.sh
      - name: Script syntax and shellcheck
        run: |
          set -euo pipefail
          scripts=(
            scripts/check-journey-couchdb.sh
            scripts/test-fixture-lifecycle.sh
            scripts/lib/fixture-lifecycle.sh
            scripts/check-journey-libsql.sh
            scripts/lib/libsql-cli-journey.sh
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          # The runner image ships shellcheck. A missing linter is a hard failure
          # here, never a silent pass: the scripts must lint on the image CI uses.
          command -v shellcheck >/dev/null || { echo "shellcheck is not installed on this runner" >&2; exit 1; }
          shellcheck --version
          shellcheck -x "${scripts[@]}"
      - name: CouchDB journey
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/couchdb-journey.log"
          # pipefail keeps the journey script's own status through tee, so a
          # failing journey fails this step; tee only captures the receipt.
          bash scripts/check-journey-couchdb.sh 2>&1 | tee "$log"
          grep -qF -- 'couchdb journey passed:' "$log"
      - name: Owned CouchDB container removed
        run: |
          set -euo pipefail
          # The journey script removes its exact owned container in its EXIT trap.
          # This proves the receipt above describes a cleanup that really happened,
          # and nothing from this job's unique name prefix survived the run.
          if docker ps -aq --filter 'name=datatug-cli-couchdb-' | grep -q .; then
            docker ps -a --filter 'name=datatug-cli-couchdb-'
            echo "the owned CouchDB container was not removed" >&2
            exit 1
          fi
          echo "no datatug-cli-couchdb- container remains"

  libsql:
    name: Journey (libSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Must be >= go.mod's `go` directive, same constraint as release.yml.
          go-version: '1.27.4'
          cache: true
      # The published dalgo2libsql fixture is executed with Node 24: it needs fetch
      # and node:crypto, and the journey's receipt must come from the exact fixture
      # the pinned module ships. The action is pinned to an immutable commit.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Script syntax and shellcheck
        run: |
          set -euo pipefail
          scripts=(
            scripts/check-journey-libsql.sh
            scripts/lib/libsql-cli-journey.sh
          )
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          command -v shellcheck >/dev/null || { echo "shellcheck is not installed on this runner" >&2; exit 1; }
          shellcheck --version
          shellcheck -x "${scripts[@]}"
      - name: libSQL journey
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/libsql-journey.log"
          # pipefail keeps the journey script's own status through tee, so a
          # failing journey fails this step; tee only captures the receipts. The
          # script prints its pass line only after the published fixture verified
          # the teardown of its own container and recorded volumes.
          bash scripts/check-journey-libsql.sh 2>&1 | tee "$log"
          grep -qF -- 'libsql journey passed:' "$log"
          grep -qF -- 'teardown: containerRemoved=true' "$log"
          grep -qF -- 'libsql journey PASS:' "$log"
      - name: Owned libSQL container removed
        run: |
          set -euo pipefail
          # The published fixture removes only the container it started, whose
          # name it owns. This proves nothing from this job survived the run and
          # never prunes another worker's Docker objects.
          if docker ps -aq --filter 'name=dalgo-libsql-fixture-' | grep -q .; then
            docker ps -a --filter 'name=dalgo-libsql-fixture-'
            echo "the owned libSQL fixture container was not removed" >&2
            exit 1
          fi
          echo "no dalgo-libsql-fixture- container remains"
