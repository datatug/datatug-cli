name: Journey (MongoDB)
on:
  pull_request:
    paths:
      - 'pkg/dbcopy/**'
      - 'pkg/secureread/**'
      - 'apps/datatugapp/commands/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/journey-mongodb.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  query:
    # The mongo:8.0 service hit SERVER-121912's kernel guard on ubuntu-latest.
    # Ubuntu 22.04 hosted runners retain the supported 6.8 kernel series;
    # keep the real-server journey on that supported host until upstream fixes it.
    # https://jira.mongodb.org/browse/SERVER-125742
    runs-on: ubuntu-22.04
    services:
      mongodb:
        image: mongo:8.3
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate private Core dependency
        uses: ./.github/actions/private-core
        with:
          private-key: ${{ secrets.SNEAT_RELEASER_PRIVATE_KEY }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./apps/datatugapp/commands ./pkg/dbcopy -run 'TestMongoDB' -count=1
        env:
          DATATUG_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/dalgo_cli_test
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017/dalgo_mongo_test
